name: Günlük PDF katalog

on:
  schedule:
    - cron: "17 3 * * *"   # her gün 06:17 (Türkiye saati)
  workflow_dispatch:        # Actions sekmesinden elle çalıştırmak için
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Kurulum
        run: pip install -r requirements.txt
      - name: Görsel önbelleği
        uses: actions/cache@v4
        with:
          path: .img-cache
          key: img-${{ github.run_id }}
          restore-keys: img-
      - name: Kataloğu üret
        run: python build_catalog.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
